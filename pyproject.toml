[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fenon"
version = "0.0.1"
description = "Python client for the Fenon API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fenon Robotics" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiortc>=1.15,<2",
    "av>=14,<18",
    "httpx2>=2.14,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "typing-extensions>=4.12",
]

[project.scripts]
fenon = "fenon.__main__:main"

[project.urls]
Repository = "https://github.com/Fenon-Robotics/fenon-sdk"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "pyright==1.1.414",
    "pytest>=9",
    "ruff==0.17.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fenon = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "PIE", "RET", "D"]
ignore = ["D101", "D102", "D103", "D105", "D106", "D107"]
exclude = [
    "src/fenon/_core/_generated.py",
    "src/fenon/_live/_generated.py",
    "src/fenon/models/pose/hamer/_generated/**",
    "src/fenon/models/pose/hamer/_generated_live/**",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tests/_wire.py" = ["N802"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["scripts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
xfail_strict = true
